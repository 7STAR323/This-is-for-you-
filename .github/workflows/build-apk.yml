name: Build test APK

on:
  push:
    branches:
      - claude/new-session-wj19nb
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_NAME: ares-call-guard.apk
      RELEASE_TAG: phase-1-test-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build the test APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ares-call-guard-apk
          path: ${{ env.APK_NAME }}

      # One release that always carries the newest build, so the phone download link never changes.
      - name: Publish to the "Phase 1 test build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Test build of commit ${GITHUB_SHA} from ${GITHUB_REF_NAME}. For testing only."
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
            gh release delete-asset "$RELEASE_TAG" ares-call-guard-debug.apk --yes || true
            gh release edit "$RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --title "Phase 1 test build" --notes "$notes" \
              --target "$GITHUB_SHA" --prerelease
          fi
